<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Card Component</title>
    <link rel="icon" href="./favicon/apple-favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon/apple-favicon.svg" />
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/card-component.css" />
  </head>
  <body>
    <!-- 카드 컴포넌트 -->
    <div class="card">
      <a class="card-link" href="/" target="_self" rel="follow" aria-hidden="true" tabindex="-1">&nbsp;</a>
      <div class="card-header">
        <h2>제품명</h2>
        <h3>이곳에 카드 내용을 추가하세요.</h3>
        <p>출시일 추후 공개</p>
      </div>
      <div class="card-buttons">
        <a href="/" class="fill-button">더 알아보기</a>
        <a href="/" class="border-button">가격 보기</a>
      </div>
    </div>
  </body>
</html>
